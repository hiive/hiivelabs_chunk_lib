name: Rust

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out hiivelabs_storage_lib
      uses: actions/checkout@v4
      with:
        repository: hiive/hiivelabs_storage_lib
        token: ${{ secrets.RUST_PAT }}
        path: workspace/hiivelabs_storage_lib
    - name: Check out chunk_lib
      uses: actions/checkout@v4
      with:
        path: workspace/chunk_lib
    - name: Build
      run: cargo build --verbose
      working-directory: ./workspace/chunk_lib
    - name: Run tests
      run: cargo test --verbose
      working-directory: ./workspace/chunk_lib
