[package]
name = "hiivelabs_chunk_lib"
version = "0.1.0"
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hiivelabs_storage_lib = { version = "0.1.0", path = "../hiivelabs_storage_lib" }
hiivelabs_rand_utils_lib = { version = "0.1.0", path = "../hiivelabs_rand_utils_lib" }

smallvec = { version = "2.0.0-alpha.10" }
# hecs = "0.10.5"
rand = { version = "0.9.0" }
getrandom = { version = "0.3.1", features = ["wasm_js"] }

# rand_core = "0.9.0"
schnellru = "0.2.4"
bitcode = { version = "0.6.4" }
miniz_oxide = "0.8.4"
uuid = { version = "1.13.2", features = ["v4"] }
blake2 = { version = "0.11.0-pre.4" }
log = "0.4.25"
indexmap = { version = "2.7.1", features = [] }
num_cpus = "1.16.0"
rustc-hash = "2.1.1"


[features]
# multithreaded_chunk_generation = []
# default=["multithreaded_chunk_generation"]

