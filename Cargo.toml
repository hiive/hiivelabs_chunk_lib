[package]
name = "hiivelabs_chunk_lib"
version = "0.1.0"
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hiivelabs_storage_lib = { version = "0.1.0", path = "../hiivelabs_storage_lib"}
hiivelabs_rand_utils_lib = { version = "0.1.0", path = "../hiivelabs_rand_utils_lib"}

smallvec = { version = "2.0.0-alpha.5"}
hecs = "0.10.4"
rand = { version = "0.9.0-alpha.1", features = ["std", "small_rng", "std_rng"] }
schnellru = "0.2.1"
bitcode = { version = "0.6.0" }
miniz_oxide = "0.7.2"
uuid = { version = "1.8.0", features = ["v4"] }
blake2 = { version = "0.11.0-pre.3" }
rand_core = "0.9.0-alpha.1"
log = "0.4.21"
indexmap = {version = "2.2.6", features = []}
num_cpus = "1.16.0"
rustc-hash = "1.1.0"
#dashmap = { Version="5.5.3", features = ["inline"] }


[features]
# multithreaded_chunk_generation = []
# default=["multithreaded_chunk_generation"]

