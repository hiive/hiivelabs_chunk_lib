[package]
name = "chunk_lib"
version = "0.1.0"
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
smallvec = { version = "1.13.1"}
hecs = "0.10.4"
rand = { version = "0.8.5", features = ["std", "small_rng", "std_rng"] }
schnellru = "0.2.1"
bitcode = { version = "0.6.0" }
miniz_oxide = "0.7.2"
uuid = { version = "1.8.0", features = ["v4"] }
blake2 = { version = "0.10.6" }
rand_core = "0.6.4"
hiivelabs_storage_lib = { version = "0.1.0", path = "../hiivelabs_storage_lib"}

